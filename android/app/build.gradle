plugins {
    id "com.android.application"
}

// Signing credentials live in android/keystore.properties (gitignored).
// build-apk.ps1 generates the keystore + this file on first run.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace "ng.carenbuddi.app"
    compileSdk 34
    buildToolsVersion "35.0.0"

    androidResources {
        // AGP's default ignoreAssetsPattern ends with <dir>_* (drop dirs whose
        // name starts with "_"), which silently excludes the Next.js _next/
        // folder from the APK — leaving the WebView app with no CSS/JS chunks.
        // Use the same defaults minus that rule.
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~"
    }

    defaultConfig {
        applicationId "ng.carenbuddi.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps.getProperty("storeFile", ""))
                storePassword keystoreProps.getProperty("storePassword")
                keyAlias keystoreProps.getProperty("keyAlias")
                keyPassword keystoreProps.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.11.0"
}
